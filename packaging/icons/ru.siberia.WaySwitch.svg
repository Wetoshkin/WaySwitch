<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Иконка WaySwitch: две раскладки и обмен между ними.
       Текст задан шрифтом с запасными вариантами: librsvg и Pango подхватят
       любой доступный sans, а цветные плашки и стрелки читаются и без букв. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3f8f"/>
      <stop offset="1" stop-color="#1f7a8c"/>
    </linearGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#e6ecff" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <!-- Подложка -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- Плашка с русской буквой: «Я», а не «А» — кириллическая «А» и латинская
       «A» выглядят одинаково, и смысл «две раскладки» терялся. -->
  <rect x="16" y="26" width="44" height="54" rx="10" fill="url(#tileA)"/>
  <text x="38" y="64" text-anchor="middle" font-family="DejaVu Sans, Cantarell, sans-serif"
        font-size="34" font-weight="bold" fill="#2b2f6b">Я</text>

  <!-- Плашка с латинской буквой -->
  <rect x="68" y="26" width="44" height="54" rx="10" fill="url(#tileB)"/>
  <text x="90" y="64" text-anchor="middle" font-family="DejaVu Sans, Cantarell, sans-serif"
        font-size="34" font-weight="bold" fill="#5a4200">A</text>

  <!-- Обмен: две встречные стрелки -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M32 92 L96 92"/>
    <path d="M89 85 L96 92 L89 99"/>
    <path d="M96 105 L32 105"/>
    <path d="M39 98 L32 105 L39 112"/>
  </g>
</svg>

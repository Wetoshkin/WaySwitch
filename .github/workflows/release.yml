name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Индекс apt
        run: sudo apt-get update
      - name: Сборка .deb
        run: bash tools/build_deb.sh
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --generate-notes \
            --title "WaySwitch $GITHUB_REF_NAME"

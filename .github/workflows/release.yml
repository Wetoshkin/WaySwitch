name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Тесты перед релизом
        run: |
          sudo apt-get update && sudo apt-get install -y libxkbcommon0 xkb-data
          pip install pytest evdev
          python -m pytest -q
      - name: Сборка .deb
        # Тег обязан совпадать с версией в pyproject.toml (v2.0.0a1 ↔ 2.0.0a1),
        # иначе релиз получит чужой номер версии в имени пакета.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"${tag}\"" pyproject.toml \
            || { echo "тег v${tag} не совпадает с version в pyproject.toml"; exit 1; }
          bash tools/build_deb.sh
      - name: Сборка .rpm
        run: sudo apt-get install -y rpm && bash tools/build_rpm.sh
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a/b/rc в теге — предрелиз: проверка обновлений предлагает его
          # только тем, у кого уже стоит предрелиз.
          pre=""
          case "$GITHUB_REF_NAME" in *a[0-9]*|*b[0-9]*|*rc[0-9]*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm $pre \
            --generate-notes \
            --title "WaySwitch $GITHUB_REF_NAME"

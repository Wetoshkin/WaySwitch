name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    # Зависимости AppImage зафиксированы для glibc 2.39 (Ubuntu 24.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Проверки перед релизом
        run: |
          sudo apt-get update && sudo apt-get install -y libxkbcommon0 libwayland-client0 xkb-data
          pip install pytest ruff evdev
          python -m ruff check .
          python -m pytest -q
          node --input-type=module --check < extension/wayswitch@wetoshkin.github.io/extension.js
          node tests/test_extension_focus.cjs
          node tests/test_extension_typing.cjs
      - name: Версии совпадают с тегом
        # Тег обязан совпадать с версией в pyproject.toml и PKGBUILD
        # (v2.0.0a2 ↔ 2.0.0a2), иначе пакеты получат чужой номер версии.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"${tag}\"" pyproject.toml \
            || { echo "тег v${tag} не совпадает с version в pyproject.toml"; exit 1; }
          grep -q "^pkgver=${tag}$" packaging/arch/PKGBUILD \
            || { echo "тег v${tag} не совпадает с pkgver в packaging/arch/PKGBUILD"; exit 1; }
      - name: Сборка .deb и .rpm
        run: |
          sudo apt-get install -y rpm libarchive-tools
          bash tools/build_deb.sh
          bash tools/build_rpm.sh
      - name: Flatpak и GNOME SDK 50
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          # Как в CI Flatpak: разрешить bubblewrap на одноразовом runner Ubuntu 24.04.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo systemctl reload apparmor
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Сборка .flatpak и .AppImage
        run: |
          sudo apt-get install -y python3 dpkg squashfs-tools
          bash tools/build_flatpak.sh build/flatpak
          python3 tools/build_appimage.py build/appimage
          cp build/flatpak/WaySwitch-Settings.flatpak build/appimage/WaySwitch-Settings-x86_64.AppImage dist/
      - name: Контрольные суммы всех пакетов
        run: |
          (cd dist && sha256sum *.deb *.rpm WaySwitch-Settings.flatpak WaySwitch-Settings-x86_64.AppImage > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a/b/rc в теге — предрелиз: проверка обновлений предлагает его
          # только тем, у кого уже стоит предрелиз.
          pre=""
          case "$GITHUB_REF_NAME" in *a[0-9]*|*b[0-9]*|*rc[0-9]*) pre="--prerelease" ;; esac
          cat > notes.md <<'EOF'
          ## Изменения в 1.1.3

          - Исправлен порядок удаления и вставки в GNOME: обе операции используют
            один поток виртуальных клавиатурных событий. Старый текстовый
            транспорт расширения заменяется сканкодами до повторного входа
            в сеанс. Новая версия протокола расширения — 4.
          - Ранняя замена до пробела теперь требует нативного проверяемого
            диапазона Writer/Calc. При перепечатке клавишами исправление ждёт
            пробела: продолжение ввода больше не смешивается с заменой префикса.
            Защита паролей и остановка при физическом вводе сохранены.
          - Подписка доступности сохраняется после простоя и запускается вместе
            со службой. Ускорен поиск поля в больших веб-редакторах, исправлено
            ожидание первого ввода при пустом снимке фокуса. Уже открытые
            Electron-приложения могут потребовать перезапуска.
          - Нативная замена диапазона Calc подключена к GNOME. На GNOME 51.1
            с LibreOffice 26.8.2.2 Flatpak прошли восемь автозамен и восемь
            ручных исправлений одиночным Ctrl: F2 и прямой ввод в ячейку,
            медленный и быстрый набор.
          - В Hermes Desktop проверены четыре автозамены из пустого редактора;
            в нативном Telegram 7.4.1 — четыре автозамены в обе стороны
            в поле сообщения без отправки. Длинный непрерывный ввод и редактор
            Telegram Flatpak не входят в этот прогон.
          - Для GridCraft 0.13.0 Flatpak подтверждено необходимое разрешение:
            `flatpak override --user --talk-name=org.a11y.Bus ai.storyteller.gridcraft`.
            Сохраните таблицы и полностью перезапустите GridCraft после изменения.
            С разрешением в отдельном экземпляре прошли четыре автозамены
            в обе стороны; нативная служба WaySwitch также необходима.

          Полный pytest прошёл на Windows и Linux. Область живых проверок
          и оставшиеся ограничения перечислены в
          [состоянии проекта](https://github.com/Wetoshkin/WaySwitch/blob/v1.1.3/docs/PROGRESS.md).
          Замена клавишами в произвольном приложении не атомарна: продолжение
          физического ввода может остановить исправление и оставить частичный
          результат. Проверенная сборка ONLYOFFICE не предоставляет пригодных
          полей доступности; графический сеанс NixOS ещё не проверен.

          ## Установка и обновление

          Откройте терминал (клавиша с логотипом Windows → наберите «Терминал»),
          вставьте команду сочетанием Ctrl+Shift+V и нажмите Enter:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/Wetoshkin/WaySwitch/main/packaging/get.sh | sh
          ```

          Скрипт сам определит дистрибутив, покажет план и спросит подтверждение.
          Для обновления — та же команда; настройки сохраняются. После установки
          перезагрузите компьютер.

          Вручную: скачайте файл ниже — `.deb` для Ubuntu 24.04+ и Debian 13+,
          `.rpm` для Fedora и openSUSE — и выполните в терминале:
          `sudo apt install "$(xdg-user-dir DOWNLOAD)"/wayswitch_*.deb` (Ubuntu, Debian),
          `sudo dnf install "$(xdg-user-dir DOWNLOAD)"/wayswitch-*.rpm` (Fedora) или
          `sudo zypper install --allow-unsigned-rpm "$(xdg-user-dir DOWNLOAD)"/wayswitch-*.rpm` (openSUSE).

          `.flatpak` и `.AppImage` содержат только окно настроек и трей.
          Для исправления раскладки нужна также нативная служба WaySwitch,
          установленная через `.deb`, `.rpm` или пакет дистрибутива.
          AppImage предназначен для x86_64 с glibc 2.39+ (Ubuntu 24.04+).
          Файл `SHA256SUMS` содержит контрольные суммы всех четырёх форматов.

          В COSMIC после запуска службы или блокировки разблокируйте экран
          и явно включите исправление в окне/трее либо командой `wayswitch resume`.
          Автоматического возобновления нет.

          ## Возможности

          - Автоматическое исправление русско-английской раскладки.
          - Ручные жесты, отмена исправления и обучение на исключениях.
          - Окно настроек, значок панели и интеграции с рабочими столами Wayland.

          Поддержка окружений и ограничения описаны в README.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Повторный запуск workflow: перезалить пакеты, а не падать.
            gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm dist/WaySwitch-Settings.flatpak dist/WaySwitch-Settings-x86_64.AppImage dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm dist/WaySwitch-Settings.flatpak dist/WaySwitch-Settings-x86_64.AppImage dist/SHA256SUMS $pre \
              --notes-file notes.md \
              --title "WaySwitch $GITHUB_REF_NAME"
          fi

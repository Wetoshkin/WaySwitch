name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  development-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Проверка публикуемой истории
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=origin/main
          fi
          python -I tools/dev_workflow.py check --base "$BASE_SHA" --fallback-base origin/main

  test:
    needs: development-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Системные библиотеки
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon0 libwayland-client0 xkb-data gettext
      - run: pip install pytest ruff evdev
      - run: python -m ruff check .
      - run: python -m pytest -q
      - name: Синтаксис расширения
        run: |
          node --input-type=module --check < extension/wayswitch@wetoshkin.github.io/extension.js
          node tests/test_extension_focus.cjs
          node tests/test_extension_typing.cjs

  nix:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/1d060086d60cb76a40cf37109f979d88a5bd6396.tar.gz
          enable_kvm: false
      - name: Сборка и проверка Nix-пакета
        run: nix-build --no-out-link -E 'let pkgs = import <nixpkgs> {}; in pkgs.callPackage ./packaging/nix/package.nix {}'

  deb:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Индекс apt
        run: sudo apt-get update
      - name: Сборка .deb
        run: bash tools/build_deb.sh
      - name: Установка собранного пакета
        run: sudo apt-get install -y ./dist/*.deb
      - name: Смок-проверка
        run: |
          wayswitch version
          python3 -c "import wayswitch, wayswitch.cli"
          test -f /usr/lib/systemd/user/wayswitch.service
          wayswitch doctor || true
      - uses: actions/upload-artifact@v4
        with:
          name: wayswitch-deb
          path: dist/*.deb

  rpm:
    needs: test
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - uses: actions/checkout@v4
      - name: Сборка .rpm
        run: dnf install -y rpm-build python3 bsdtar && bash tools/build_rpm.sh
      - name: Установка собранного пакета
        run: dnf install -y ./dist/*.noarch.rpm
      - name: Смок-проверка
        run: |
          wayswitch version
          test -f /usr/lib/systemd/user/wayswitch.service
          python3 -c "import sys; sys.path.insert(0, '/usr/lib/wayswitch'); import wayswitch.gui.app, wayswitch.daemon"
      - uses: actions/upload-artifact@v4
        with:
          name: wayswitch-rpm
          path: dist/*.rpm

  arch:
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка по опубликованным исходникам PKGBUILD
        run: |
          pacman -Syu --noconfirm base-devel sudo
          useradd -m b
          mkdir -p /pkg
          cp -r packaging/arch/. /pkg/
          chown -R b /pkg
          su b -c "cd /pkg && makepkg --nodeps"
          pacman -U --noconfirm /pkg/wayswitch-*.pkg.tar.zst
          wayswitch version
          diff -r --exclude=__pycache__ wayswitch /usr/lib/wayswitch/wayswitch

  flatpak:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Flatpak и GNOME SDK 50
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Как в CI Flatpak: разрешить bubblewrap на одноразовом runner Ubuntu 24.04.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo systemctl reload apparmor
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Сборка .flatpak
        run: bash tools/build_flatpak.sh build/flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: wayswitch-flatpak
          path: build/flatpak/WaySwitch-Settings.flatpak
          if-no-files-found: error

  development-gate:
    if: always()
    needs: [development-policy, test, deb, rpm, arch, flatpak, appimage, nix]
    runs-on: ubuntu-latest
    steps:
      - name: Результат всех проверок и сборок
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              print("Failed or skipped: " + ", ".join(failed))
              sys.exit(1)
          print("All required checks and package builds passed")
          PY

  appimage:
    needs: test
    # Зависимости AppImage зафиксированы для glibc 2.39 (Ubuntu 24.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Инструменты сборки AppImage
        run: sudo apt-get update && sudo apt-get install -y python3 dpkg squashfs-tools
      - name: Сборка .AppImage
        run: python3 tools/build_appimage.py build/appimage
      - name: Проверка значка в готовом AppImage
        run: |
          cd build/appimage
          ./WaySwitch-Settings-x86_64.AppImage --appimage-extract .DirIcon > /dev/null
          cmp squashfs-root/.DirIcon ../../packaging/icons/io.github.Wetoshkin.WaySwitch.png
      - uses: actions/upload-artifact@v4
        with:
          name: wayswitch-appimage
          path: build/appimage/WaySwitch-Settings-x86_64.AppImage
          if-no-files-found: error
